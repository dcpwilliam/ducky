# 发布工作流：在打 `v*` tag 或手动触发时，跨平台打包安装包并发布到 GitHub Release。
#
# 已知限制（生产前需处理）：
#   1. 未签名：当前不配置 CSC_LINK / 签名证书，产出 unsigned 安装包（个人分发可接受，
#      正式发布建议补 macOS 公证 + Windows 代码签名）。
#   2. 打包前会通过 `npm run fetch-python(:win)` 把对应平台的 Python 运行时拉取到
#      resources/python/（electron-builder 的 extraResources 会将其打进安装包），故 macOS 出
#      arm64 python、Windows 出 x64 python，运行时与平台匹配（locate.ts 的 getBundledPython
#      读取的正是 resources/python）。注意 mac runner 默认取 arm64；要 x64 dmg 需显式
#      `node scripts/fetch-python.mjs mac-x64`。

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write   # 用于 softprops/action-gh-release 创建 Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (electron-vite)
        run: npm run build

      - name: Fetch macOS Python runtime
        if: matrix.os == 'macos-latest'
        run: npm run fetch-python

      - name: Package macOS (dmg, unsigned)
        if: matrix.os == 'macos-latest'
        env:
          CSC_IDENTITY_AUTO_DISCOVER: 'false'
        run: npx electron-builder --mac --config electron-builder.yml --publish never

      - name: Fetch Windows Python runtime
        if: matrix.os == 'windows-latest'
        run: npm run fetch-python:win

      - name: Package Windows (nsis, unsigned)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --config electron-builder.yml --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ducky-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: warn

      # 仅在打 tag 时把产物作为 GitHub Release 资产发布（手动触发时不创建 Release）。
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
